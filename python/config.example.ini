; ArvanShare configuration.
; Copy this file to config.ini and fill in your real values.
; config.ini is gitignored - never commit real keys.

[arvan]
; S3-compatible endpoint of your ArvanCloud Object Storage region.
; Find it in the ArvanCloud panel: Object Storage -> your bucket -> "S3 Endpoint".
; Examples:
;   https://s3.ir-thr-at1.arvanstorage.ir
;   https://s3.ir-tbz-sh1.arvanstorage.ir
endpoint = https://s3.ir-thr-at1.arvanstorage.ir

; Region code matching the endpoint above (mostly informational for S3).
region = ir-thr-at1

; Name of the shared bucket created in the ArvanCloud panel.
bucket = my-family-share

; API keys generated in the ArvanCloud panel (Object Storage -> API Keys).
access_key = YOUR_ACCESS_KEY
secret_key = YOUR_SECRET_KEY
