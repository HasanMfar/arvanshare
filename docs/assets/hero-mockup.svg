<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C2E" />
      <stop offset="50%" stop-color="#12131A" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0" />
      <stop offset="100%" stop-color="#3949AB" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1" />
      <stop offset="100%" stop-color="#00BCD4" />
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3F58" />
      <stop offset="50%" stop-color="#25283B" />
      <stop offset="100%" stop-color="#1E2030" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2030" />
      <stop offset="100%" stop-color="#181A26" />
    </linearGradient>

    <linearGradient id="imgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F51B5" />
      <stop offset="50%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#26A69A" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#5C6BC0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background with Ambient Lights -->
  <rect width="1200" height="680" rx="24" fill="url(#bgGlow)" />
  <circle cx="280" cy="340" r="220" fill="#3949AB" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="850" cy="240" r="260" fill="#00BCD4" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="680" />
    <line x1="300" y1="0" x2="300" y2="680" />
    <line x1="500" y1="0" x2="500" y2="680" />
    <line x1="700" y1="0" x2="700" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="1100" y1="0" x2="1100" y2="680" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- ──────────────── DESKTOP WINDOW MOCKUP (Right / Background) ──────────────── -->
  <g transform="translate(480, 50)" filter="url(#softShadow)">
    <!-- Window Body -->
    <rect width="660" height="560" rx="14" fill="#12131A" stroke="#333560" stroke-width="2"/>

    <!-- Titlebar -->
    <path d="M0 14 Q0 0 14 0 L646 0 Q660 0 660 14 L660 42 L0 42 Z" fill="#1E2030"/>
    <circle cx="24" cy="21" r="6" fill="#EF5350"/>
    <circle cx="44" cy="21" r="6" fill="#FFA726"/>
    <circle cx="64" cy="21" r="6" fill="#66BB6A"/>
    <text x="330" y="26" fill="#E8EAF6" font-size="13" font-weight="600" text-anchor="middle">ArvanShare — Desktop Client (Windows)</text>

    <!-- Toolbar -->
    <rect x="0" y="42" width="660" height="48" fill="#181A26" stroke="#252840" stroke-width="1"/>
    <!-- Button Compose -->
    <rect x="20" y="52" width="110" height="28" rx="6" fill="#5C6BC0"/>
    <text x="75" y="70" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">✍️ New Post</text>
    <!-- Button Sync -->
    <rect x="140" y="52" width="90" height="28" rx="6" fill="#252840" stroke="#333560"/>
    <text x="185" y="70" fill="#E8EAF6" font-size="12" font-weight="500" text-anchor="middle">🔄 Refresh</text>
    <!-- Settings Button -->
    <rect x="580" y="52" width="60" height="28" rx="6" fill="#252840" stroke="#333560"/>
    <text x="610" y="70" fill="#9FA8DA" font-size="12" text-anchor="middle">⚙️</text>

    <!-- Desktop Feed Content -->
    <!-- Card 1 (Sara) -->
    <g transform="translate(20, 105)">
      <rect width="620" height="180" rx="10" fill="#1E2030" stroke="#2A2D45" stroke-width="1"/>
      <!-- Avatar -->
      <circle cx="36" cy="36" r="18" fill="#EC407A"/>
      <text x="36" y="42" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">S</text>
      <text x="66" y="32" fill="#FFFFFF" font-size="14" font-weight="600">Sara</text>
      <text x="66" y="48" fill="#5C6497" font-size="11">Today at 10:45 AM • ArvanCloud S3</text>

      <text x="25" y="82" fill="#E8EAF6" font-size="13">Updated the system specs and architecture documentation! ☁️</text>
      <text x="25" y="102" fill="#E8EAF6" font-size="13">All likes are now zero-contention atomic files on object storage.</text>

      <!-- Attachment chip -->
      <rect x="25" y="118" width="190" height="26" rx="6" fill="#252840" stroke="#333560"/>
      <text x="35" y="135" fill="#4DD0E1" font-size="11">📎 architecture_v2.pdf</text>

      <!-- Action bar -->
      <line x1="20" y1="152" x2="600" y2="152" stroke="#252840"/>
      <text x="30" y="170" fill="#4DD0E1" font-size="12">❤️ Liked (Reza, Ali, Hasan)</text>
      <text x="200" y="170" fill="#9FA8DA" font-size="12">💬 3 Comments</text>
    </g>

    <!-- Card 2 (Reza) -->
    <g transform="translate(20, 300)">
      <rect width="620" height="150" rx="10" fill="#1E2030" stroke="#2A2D45" stroke-width="1"/>
      <circle cx="36" cy="36" r="18" fill="#26A69A"/>
      <text x="36" y="42" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">R</text>
      <text x="66" y="32" fill="#FFFFFF" font-size="14" font-weight="600">Reza</text>
      <text x="66" y="48" fill="#5C6497" font-size="11">Yesterday at 6:12 PM</text>

      <text x="25" y="82" fill="#E8EAF6" font-size="13">Native Windows .EXE and Android APK build seamlessly via GitHub Actions 🚀</text>

      <line x1="20" y1="112" x2="600" y2="112" stroke="#252840"/>
      <text x="30" y="132" fill="#9FA8DA" font-size="12">🤍 Like (2)</text>
      <text x="120" y="132" fill="#9FA8DA" font-size="12">💬 1 Comment</text>
    </g>

    <!-- Desktop Statusbar -->
    <rect x="0" y="522" width="660" height="38" fill="#181A26" stroke="#252840" stroke-width="1"/>
    <circle cx="20" cy="541" r="5" fill="#00BCD4" filter="url(#neonGlow)"/>
    <text x="35" y="546" fill="#9FA8DA" font-size="11">Bucket: s3.ir-thr-at1.arvanstorage.ir/family-feed • Ready</text>
    <text x="590" y="546" fill="#5C6497" font-size="11">v1.0.0-beta.2</text>
  </g>

  <!-- ──────────────── S3 DATA CONNECTOR BEAM ──────────────── -->
  <g transform="translate(360, 240)">
    <path d="M -40 80 Q 80 40 180 80" fill="none" stroke="url(#beamGrad)" stroke-width="4" stroke-dasharray="6 6"/>
    <!-- Floating S3 Cloud Node -->
    <rect x="40" y="40" width="100" height="42" rx="21" fill="#1E2030" stroke="#00BCD4" stroke-width="2" filter="url(#neonGlow)"/>
    <text x="90" y="66" fill="#4DD0E1" font-size="12" font-weight="bold" text-anchor="middle">☁️ S3 Bucket</text>
  </g>

  <!-- ──────────────── ANDROID MOBILE PHONE MOCKUP (Left / Foreground) ──────────────── -->
  <g transform="translate(80, 40)" filter="url(#softShadow)">
    <!-- Phone Chassis -->
    <rect width="320" height="600" rx="42" fill="#0B0C10" stroke="url(#phoneBorder)" stroke-width="6"/>
    <!-- Phone Screen -->
    <rect x="10" y="10" width="300" height="580" rx="34" fill="#12131A"/>

    <!-- Android Notch / Camera Pill -->
    <rect x="110" y="18" width="80" height="18" rx="9" fill="#000000"/>
    <circle cx="165" cy="27" r="4" fill="#1E2030"/>

    <!-- App Top Bar -->
    <g transform="translate(10, 36)">
      <rect width="300" height="50" fill="#181A26"/>
      <circle cx="32" cy="25" r="14" fill="#5C6BC0"/>
      <text x="32" y="30" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">AS</text>
      <text x="56" y="27" fill="#E8EAF6" font-size="16" font-weight="700">ArvanShare</text>
      <text x="56" y="40" fill="#4DD0E1" font-size="9" font-weight="500">SERVERLESS SOCIAL</text>

      <circle cx="270" cy="25" r="14" fill="#252840"/>
      <text x="270" y="29" fill="#9FA8DA" font-size="12" text-anchor="middle">⚙️</text>
    </g>

    <!-- Mobile Feed Cards -->
    <!-- Card 1 (Ali - Image Post) -->
    <g transform="translate(20, 96)">
      <rect width="280" height="260" rx="14" fill="url(#cardGrad)" stroke="#282B40" stroke-width="1"/>
      
      <!-- Author row -->
      <circle cx="24" cy="24" r="14" fill="#5C6BC0"/>
      <text x="24" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">A</text>
      <text x="46" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Ali</text>
      <text x="46" y="34" fill="#5C6497" font-size="9">2 mins ago</text>

      <!-- Post Body -->
      <text x="14" y="56" fill="#E8EAF6" font-size="11">Weekend trip with the family! 🌄</text>
      
      <!-- Media Thumbnail -->
      <rect x="14" y="66" width="252" height="130" rx="8" fill="url(#imgGrad1)"/>
      <path d="M 24 176 L 90 120 L 150 160 L 210 100 L 266 176 Z" fill="#12131A" opacity="0.4"/>
      <circle cx="70" cy="100" r="14" fill="#FFF59D" opacity="0.8"/>
      <text x="140" y="136" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle" filter="url(#softShadow)">ArvanCloud Media</text>

      <!-- Mobile Interactions -->
      <g transform="translate(14, 210)">
        <rect x="0" y="0" width="76" height="24" rx="12" fill="#252840"/>
        <text x="12" y="16" fill="#EF5350" font-size="12">❤️</text>
        <text x="32" y="16" fill="#E8EAF6" font-size="11" font-weight="600">5</text>

        <rect x="84" y="0" width="76" height="24" rx="12" fill="#252840"/>
        <text x="96" y="16" fill="#4DD0E1" font-size="12">💬</text>
        <text x="116" y="16" fill="#E8EAF6" font-size="11" font-weight="600">2</text>
      </g>
    </g>

    <!-- Card 2 (Hasan) -->
    <g transform="translate(20, 368)">
      <rect width="280" height="135" rx="14" fill="url(#cardGrad)" stroke="#282B40" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#00BCD4"/>
      <text x="24" y="28" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">H</text>
      <text x="46" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Hasan</text>
      <text x="46" y="34" fill="#5C6497" font-size="9">1 hour ago</text>

      <text x="14" y="56" fill="#E8EAF6" font-size="11">Zero server maintenance, zero db leaks.</text>
      <text x="14" y="70" fill="#4DD0E1" font-size="10">#Serverless #RoomCache #JetpackCompose</text>

      <!-- Action row -->
      <g transform="translate(14, 90)">
        <text x="0" y="16" fill="#EF5350" font-size="12">❤️ 8</text>
        <text x="60" y="16" fill="#9FA8DA" font-size="12">💬 4</text>
      </g>
    </g>

    <!-- Android Floating Action Button (FAB) -->
    <circle cx="260" cy="520" r="24" fill="#5C6BC0" filter="url(#neonGlow)"/>
    <text x="260" y="527" fill="#FFFFFF" font-size="22" font-weight="300" text-anchor="middle">+</text>

    <!-- Bottom Nav Indicator -->
    <rect x="110" y="574" width="80" height="4" rx="2" fill="#9FA8DA" opacity="0.4"/>
  </g>
</svg>
