<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2030"/>
      <stop offset="100%" stop-color="#12131A"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="50%" stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00BCD4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Cloud Base Silhouette -->
  <g filter="url(#glow)">
    <path d="M380 340 C424.18 340 460 304.18 460 260 C460 218.42 428.32 184.23 387.89 180.48 C375.14 117.82 319.78 70 252 70 C175.79 70 114 131.79 114 208 C114 213.2 114.33 218.32 114.97 223.34 C76.01 234.39 48 269.83 48 312 C48 360.6 87.4 400 136 400 L370 400 C403.14 400 430 373.14 430 340 Z" fill="url(#primaryGrad)" opacity="0.25"/>
  </g>

  <!-- Stylized Modern Cloud Shape -->
  <path d="M370 360 L140 360 C106.86 360 80 333.14 80 300 C80 270.82 100.77 246.49 128.84 241.13 C128.29 237.47 128 233.77 128 230 C128 174.77 172.77 130 228 130 C272.93 130 310.87 159.58 323.51 200.41 C332.68 196.34 342.82 194 353.5 194 C390.23 194 420 223.77 420 260.5 C420 293.42 396.06 320.75 365 326.1" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Social Share / Node Mesh Inside Cloud -->
  <!-- Center Hub -->
  <circle cx="256" cy="256" r="28" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="14" fill="#12131A"/>

  <!-- Node 1 (Top Right) -->
  <circle cx="340" cy="200" r="18" fill="url(#accentGrad)"/>
  <line x1="256" y1="256" x2="340" y2="200" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Node 2 (Bottom Right) -->
  <circle cx="330" cy="310" r="18" fill="url(#accentGrad)"/>
  <line x1="256" y1="256" x2="330" y2="310" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Node 3 (Left) -->
  <circle cx="170" cy="270" r="20" fill="url(#accentGrad)"/>
  <line x1="256" y1="256" x2="170" y2="270" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Node 4 (Top Left) -->
  <circle cx="195" cy="185" r="14" fill="#5C6BC0"/>
  <line x1="170" y1="270" x2="195" y2="185" stroke="#5C6BC0" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 6"/>
  <line x1="256" y1="256" x2="195" y2="185" stroke="#5C6BC0" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 6"/>
</svg>
