<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2E55"/>
      <stop offset="100%" stop-color="#12131A"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0"/>
      <stop offset="52%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
    <filter id="bubbleShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded-square badge -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="502" height="502" rx="115" fill="none"
        stroke="#5C6BC0" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Speech bubble: one bold shape, gradient fill ending in brand teal -->
  <g filter="url(#bubbleShadow)">
    <path d="M180 96 H332 C378 96 416 134 416 180 V260 C416 306 378 344 332 344
             H272 L188 430 C180 438 168 432 170 421 L178 344
             H180 C134 344 96 306 96 260 V180 C96 134 134 96 180 96 Z"
          fill="url(#bubbleGrad)"/>
  </g>

  <!-- Share-network glyph: two connectors, three nodes -->
  <g stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-opacity="0.92">
    <line x1="198" y1="238" x2="312" y2="178"/>
    <line x1="198" y1="238" x2="312" y2="298"/>
  </g>
  <circle cx="198" cy="238" r="30" fill="#FFFFFF"/>
  <circle cx="312" cy="178" r="26" fill="#FFFFFF"/>
  <circle cx="312" cy="298" r="26" fill="#FFFFFF"/>
</svg>
