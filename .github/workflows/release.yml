name: Release

# Triggers on any version tag (e.g. v1.0.0, v1.2.3-beta)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Job 1 — Android release APK
  # ─────────────────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        run: |
          TAG=${GITHUB_REF_NAME}
          cp app/build/outputs/apk/release/app-release.apk \
             ArvanShare-${TAG}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ArvanShare-*.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  #  Job 2 — Windows portable EXE (PyInstaller)
  # ─────────────────────────────────────────────────────────────────────────
  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run tests (offline mock)
        working-directory: python
        run: pytest test_mock.py -q

      - name: Build portable EXE
        working-directory: python
        run: |
          python -m PyInstaller `
            --onefile `
            --noconsole `
            --name ArvanShare `
            --add-data "config.example.ini;." `
            desktop.py

      - name: Rename EXE with version tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item python/dist/ArvanShare.exe "ArvanShare-$tag-windows.exe"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ArvanShare-*-windows.exe
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  #  Job 3 — Create GitHub Release and attach both assets
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [android, windows-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          # Extract the section for this tag from CHANGELOG.md
          NOTES=$(awk "/^## \[${TAG#v}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES"     >> "$GITHUB_OUTPUT"
          echo "EOF"        >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ArvanShare ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ArvanShare-*.apk
            ArvanShare-*-windows.exe
