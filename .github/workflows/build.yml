name: Build APK & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  #  Job 1 — Build Android APK
  # ─────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Decode release keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -di > keystore/release.jks
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK via Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease -x lintVitalRelease --no-daemon

      - name: Archive APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArvanShare-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  #  Job 2 — Python tests (offline mock S3)
  # ─────────────────────────────────────────────────────────────────────────
  python-tests:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: pip install -r requirements.txt

      - name: Run offline tests
        working-directory: python
        run: pytest test_mock.py -q
