<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A26" />
      <stop offset="100%" stop-color="#0E0F14" />
    </linearGradient>

    <linearGradient id="androidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#07C160" />
    </linearGradient>

    <linearGradient id="desktopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776AB" />
      <stop offset="100%" stop-color="#1E4B75" />
    </linearGradient>

    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C6BC0" />
      <stop offset="100%" stop-color="#3949AB" />
    </linearGradient>

    <linearGradient id="s3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#00695C" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2030" />
      <stop offset="100%" stop-color="#151722" />
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="620" rx="20" fill="url(#archBg)" stroke="#252840" stroke-width="2"/>

  <!-- Title Section -->
  <text x="500" y="44" fill="#E8EAF6" font-size="18" font-weight="bold" text-anchor="middle">ArvanShare — Serverless Object Storage Architecture</text>
  <text x="500" y="66" fill="#9FA8DA" font-size="13" text-anchor="middle">Direct-to-S3 Race-Free Social Data Mesh (No Backend, No Central Database)</text>

  <!-- ── 1. CLIENT LAYER (Top) ── -->
  <g transform="translate(60, 95)">
    <!-- Android Card -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="260" height="110" rx="12" fill="url(#cardGrad)" stroke="#3DDC84" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="16" fill="url(#androidGrad)"/>
      <text x="35" y="41" fill="#FFFFFF" font-size="16" text-anchor="middle">📱</text>
      <text x="65" y="32" fill="#E8EAF6" font-size="15" font-weight="bold">Android App</text>
      <text x="65" y="48" fill="#3DDC84" font-size="11">Kotlin • Jetpack Compose</text>
      <text x="20" y="78" fill="#9FA8DA" font-size="11">• Room DB Offline Cache</text>
      <text x="20" y="94" fill="#9FA8DA" font-size="11">• Coil Media Engine • M3 Theme</text>
    </g>

    <!-- Desktop Card -->
    <g transform="translate(310, 0)" filter="url(#boxShadow)">
      <rect width="260" height="110" rx="12" fill="url(#cardGrad)" stroke="#4DD0E1" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="16" fill="url(#desktopGrad)"/>
      <text x="35" y="41" fill="#FFFFFF" font-size="16" text-anchor="middle">💻</text>
      <text x="65" y="32" fill="#E8EAF6" font-size="15" font-weight="bold">Windows Client</text>
      <text x="65" y="48" fill="#4DD0E1" font-size="11">Python 3.10+ • Tkinter</text>
      <text x="20" y="78" fill="#9FA8DA" font-size="11">• Portable Standalone .EXE</text>
      <text x="20" y="94" fill="#9FA8DA" font-size="11">• Card Feed &amp; Attachment Viewer</text>
    </g>

    <!-- CLI Card -->
    <g transform="translate(620, 0)" filter="url(#boxShadow)">
      <rect width="260" height="110" rx="12" fill="url(#cardGrad)" stroke="#5C6BC0" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="16" fill="url(#cliGrad)"/>
      <text x="35" y="41" fill="#FFFFFF" font-size="16" text-anchor="middle">🛠️</text>
      <text x="65" y="32" fill="#E8EAF6" font-size="15" font-weight="bold">Python CLI / Bot</text>
      <text x="65" y="48" fill="#5C6BC0" font-size="11">Boto3 Reference Engine</text>
      <text x="20" y="78" fill="#9FA8DA" font-size="11">• Headless Automation</text>
      <text x="20" y="94" fill="#9FA8DA" font-size="11">• Moto Offline Test Suite</text>
    </g>
  </g>

  <!-- ── CONNECTOR ARROWS ── -->
  <g stroke="#00BCD4" stroke-width="2" stroke-dasharray="5 5" fill="none">
    <path d="M 190 205 L 190 260 L 450 260"/>
    <path d="M 500 205 L 500 280"/>
    <path d="M 810 205 L 810 260 L 550 260"/>
  </g>

  <!-- Direct Auth Badge -->
  <rect x="360" y="246" width="280" height="28" rx="14" fill="#181A26" stroke="#5C6BC0" stroke-width="1"/>
  <text x="500" y="265" fill="#4DD0E1" font-size="11" font-weight="bold" text-anchor="middle">🔒 Direct S3 Signed Requests (HMAC-SHA256)</text>

  <!-- ── 2. ARVANCLOUD S3 BUCKET LAYER (Center) ── -->
  <g transform="translate(180, 290)" filter="url(#boxShadow)">
    <rect width="640" height="80" rx="14" fill="url(#cardGrad)" stroke="#00BCD4" stroke-width="2"/>
    <circle cx="45" cy="40" r="22" fill="url(#s3Grad)"/>
    <text x="45" y="48" fill="#FFFFFF" font-size="20" text-anchor="middle">☁️</text>
    <text x="85" y="34" fill="#E8EAF6" font-size="16" font-weight="bold">ArvanCloud Object Storage (S3-Compatible)</text>
    <text x="85" y="54" fill="#9FA8DA" font-size="12">Atomic Operations: PutObject • GetObject • DeleteObject • ListObjectsV2</text>
    <rect x="530" y="26" width="90" height="28" rx="6" fill="#00363D" stroke="#00BCD4"/>
    <text x="575" y="44" fill="#4DD0E1" font-size="11" font-weight="bold" text-anchor="middle">Zero Server</text>
  </g>

  <!-- Connectors to Storage Sub-trees -->
  <g stroke="#5C6BC0" stroke-width="2" fill="none">
    <path d="M 500 370 L 500 405"/>
    <path d="M 210 405 L 790 405"/>
    <path d="M 210 405 L 210 425"/>
    <path d="M 500 405 L 500 425"/>
    <path d="M 790 405 L 790 425"/>
  </g>

  <!-- ── 3. S3 STORAGE HIERARCHY / DATA MODEL (Bottom) ── -->
  <g transform="translate(60, 425)" filter="url(#boxShadow)">
    <rect width="270" height="150" rx="10" fill="#1E2030" stroke="#333560" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#252840"/>
    <text x="15" y="21" fill="#4DD0E1" font-size="12" font-weight="bold">📁 /posts/</text>
    
    <text x="15" y="55" fill="#E8EAF6" font-size="11" font-family="monospace">20260806_1200_ali_post.json</text>
    <text x="25" y="70" fill="#9FA8DA" font-size="10">↳ text, author, timestamp</text>
    
    <text x="15" y="95" fill="#E8EAF6" font-size="11" font-family="monospace">20260806_1200_ali_img.jpg</text>
    <text x="25" y="110" fill="#9FA8DA" font-size="10">↳ full-res media attachment</text>

    <text x="15" y="134" fill="#3DDC84" font-size="10">✓ Read via ListObjectsV2</text>
  </g>

  <g transform="translate(365, 425)" filter="url(#boxShadow)">
    <rect width="270" height="150" rx="10" fill="#1E2030" stroke="#333560" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#252840"/>
    <text x="15" y="21" fill="#4DD0E1" font-size="12" font-weight="bold">📁 /comments/&lt;post_id&gt;/</text>
    
    <text x="15" y="55" fill="#E8EAF6" font-size="11" font-family="monospace">120530_reza.json</text>
    <text x="25" y="70" fill="#9FA8DA" font-size="10">↳ comment by Reza</text>

    <text x="15" y="95" fill="#E8EAF6" font-size="11" font-family="monospace">120600_sara.json</text>
    <text x="25" y="110" fill="#9FA8DA" font-size="10">↳ comment by Sara</text>

    <text x="15" y="134" fill="#3DDC84" font-size="10">✓ Independent files per reply</text>
  </g>

  <g transform="translate(670, 425)" filter="url(#boxShadow)">
    <rect width="270" height="150" rx="10" fill="#1E2030" stroke="#333560" stroke-width="1"/>
    <rect x="0" y="0" width="270" height="32" rx="10" fill="#252840"/>
    <text x="15" y="21" fill="#EF5350" font-size="12" font-weight="bold">❤️ /likes/ (Atomic Markers)</text>
    
    <text x="15" y="55" fill="#E8EAF6" font-size="11" font-family="monospace">like_sara.txt</text>
    <text x="25" y="70" fill="#9FA8DA" font-size="10">↳ PutObject (0 bytes)</text>

    <text x="15" y="95" fill="#E8EAF6" font-size="11" font-family="monospace">like_reza.txt</text>
    <text x="25" y="110" fill="#9FA8DA" font-size="10">↳ DeleteObject (Unlike)</text>

    <text x="15" y="134" fill="#4DD0E1" font-size="10">🛡️ Race-condition safe!</text>
  </g>
</svg>
